[package]
name = "grove"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/git-core"]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"
git-core = { path = "crates/git-core" }
# The editor's change bars: the same line diff Git itself uses.
imara-diff = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }
